<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GTech Thymeleaf Demo</title>
    <style>
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 5px;
        }
        .center{
            margin-left: auto;
            margin-right: auto;
            width:50%;
        }
        .alignText{
            text-align: center;
        }
    </style>
</head>
<body style="background-color:skyblue;">
<div class="alignText">
    <h1 class="center"; style="color:blue; font-family:Verdana; font-size: xx-large; font-weight:bold; border: 2px solid brown; padding: 10px; width:40%">Thymeleaf Demo by Ghislain Muabila</h1>
    <p style="color:green;background-color:tomato;">This is to test rendering a Dynamic web page using Thymeleaf.<br><br></p>
    <p style="color:red; font-style:italic;font-family:Geneva;">This is a red paragraph.</p>
    <br><br>

    <h1 style="font-family:Verdana">User Registration</h1>
</div>
<div class="alignText">
    <form th:action="@{/booksapi/addBookfrombrowser}" th:object="${user}" method="post">
        <label>Full name:</label>
        <input type="text" th:field="*{name}" /><br/>
        <label>E-mail:</label>
        <input type="text" th:field="*{email}" /><br/>
        <label>Password:</label>
        <input type="password" th:field="*{password}" /><br/>
        <label>Birthday (yyyy-mm-dd):</label>
        <input type="text" th:field="*{dob}" /><br/>

        <div>
        <label>Gender:</label>
        <input type="radio" id="male" name="gender">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender">
        <label for="female">Female</label><br>
        </div>

<!--                <input type="radio" th:field="*{gender}" value="Male">Male-->
<!--        <input type="radio" th:field="*{gender}" value="Female" />Female<br/>-->

        <label>Profession:</label>
        <select th:field="*{profession}">
            <option th:each="p : ${listProfession}" th:value="${p}" th:text="${p}" />
        </select>
        <br/>

        <label>Married?</label>
        <input type="checkbox" th:field="*{married}" /><br/>

        <label>Note:</label>
        <textarea rows="5" cols="50" th:field="*{note}"></textarea>
        <br/>

        <button type="submit">Register</button>
        <br><br>
        <input type="submit" value="Submit"/><br><br>
        <input type="reset" value="Reset"/>
    </form>
</div>
<br><br><br>
<p style="font-family: Verdana; font-size: large; text-align: center">Regards,<br>Ghislain Muabila
</p>

</body>
</html>
